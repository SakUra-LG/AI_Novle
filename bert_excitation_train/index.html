<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI小说自动生成系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .sidebar {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .content-area {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .chapter-list {
            margin-bottom: 20px;
        }

        .chapter-list h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .chapter-item {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .chapter-item:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .chapter-item.active {
            border-color: #667eea;
            background: #e3f2fd;
        }

        .chapter-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .chapter-info {
            font-size: 0.9em;
            color: #666;
        }

        .control-panel {
            margin-bottom: 20px;
        }

        .control-panel h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            margin: 5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: linear-gradient(45deg, #6c757d, #495057);
        }

        .btn-success {
            background: linear-gradient(45deg, #28a745, #20c997);
        }

        .btn-warning {
            background: linear-gradient(45deg, #ffc107, #fd7e14);
        }


        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e9ecef;
        }

        .content-title {
            color: #667eea;
            font-size: 1.5em;
            font-weight: bold;
        }

        .version-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .version-tab {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .version-tab:hover {
            border-color: #667eea;
            background: #e3f2fd;
        }

        .version-tab.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .content-display {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            min-height: 400px;
            max-height: 600px;
            overflow-y: auto;
            border: 1px solid #e9ecef;
        }

        .content-text {
            line-height: 1.8;
            font-size: 1.1em;
            color: #333;
            white-space: pre-wrap;
        }

        .score-display {
            background: linear-gradient(45deg, #28a745, #20c997);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            margin: 10px 0;
            display: inline-block;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-bar {
            background: #e9ecef;
            padding: 10px 20px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 0.9em;
            color: #666;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #f5c6cb;
            margin: 10px 0;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #c3e6cb;
            margin: 10px 0;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .version-tabs {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>AI小说自动生成系统</h1>
            <p>基于大语言模型的智能小说创作平台</p>
        </div>

        <div class="main-content">
            <div class="sidebar">
                <div class="chapter-list">
                    <h3>📚 章节列表</h3>
                    <div id="chapterList">
                        <!-- 章节列表将通过JavaScript动态加载 -->
                    </div>
                </div>

                <div class="control-panel">
                    <h3>🎛️ 控制面板</h3>
                    <button class="btn" onclick="refreshChapters()">🔄 刷新章节</button>
                    <button class="btn btn-success" onclick="generateNewChapter()">✨ 生成新章节</button>
                    <button class="btn btn-warning" onclick="trainModel()">🧠 训练模型</button>
                    <button class="btn btn-secondary" onclick="viewStats()">📊 查看统计</button>
                </div>

                <div class="status-bar" id="statusBar">
                    系统就绪 - 请选择章节查看内容
                </div>
            </div>

            <div class="content-area">
                <div class="content-header">
                    <div class="content-title" id="contentTitle">请选择章节</div>
                </div>

                <div class="version-tabs" id="versionTabs" style="display: none;">
                    <div class="version-tab active" onclick="switchVersion(1)">版本 1</div>
                    <div class="version-tab" onclick="switchVersion(2)">版本 2</div>
                    <div class="version-tab" onclick="switchVersion(3)">版本 3</div>
                </div>

                <div class="content-display" id="contentDisplay">
                    <div class="loading">正在加载章节列表...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentChapter = null;
        let currentVersion = 1;
        let chapters = [];

        // 初始化页面
        document.addEventListener('DOMContentLoaded', function() {
            loadChapters();
        });

        // 加载章节列表
        async function loadChapters() {
            try {
                updateStatus('正在加载章节列表...');
                
                // 模拟从后端API获取章节列表
                // 在实际项目中，这里应该调用真实的API
                chapters = await fetchChaptersFromAPI();
                
                renderChapterList();
                updateStatus('章节列表加载完成');
            } catch (error) {
                console.error('加载章节失败:', error);
                showError('加载章节失败: ' + error.message);
            }
        }

        // 从后端API获取章节列表
        async function fetchChaptersFromAPI() {
            try {
                const response = await fetch('/api/chapters');
                const result = await response.json();
                
                if (result.success) {
                    return result.data;
                } else {
                    throw new Error(result.error || '获取章节列表失败');
                }
            } catch (error) {
                console.error('API调用失败:', error);
                // 如果API调用失败，返回模拟数据
                return generateMockChapters();
            }
        }

        // 生成模拟章节数据（作为备用）
        function generateMockChapters() {
            const mockChapters = [];
            for (let i = 1; i <= 24; i++) {
                mockChapters.push({
                    id: i,
                    title: `第${i}章`,
                    has_content: Math.random() > 0.3,
                    versions: Math.floor(Math.random() * 3) + 1,
                    last_modified: new Date(Date.now() - Math.random() * 7 * 24 * 60 * 60 * 1000)
                });
            }
            return mockChapters;
        }

        // 渲染章节列表
        function renderChapterList() {
            const chapterList = document.getElementById('chapterList');
            chapterList.innerHTML = '';

            chapters.forEach(chapter => {
                const chapterItem = document.createElement('div');
                chapterItem.className = 'chapter-item';
                chapterItem.onclick = () => selectChapter(chapter);
                
                chapterItem.innerHTML = `
                    <div class="chapter-title">${chapter.title}</div>
                    <div class="chapter-info">
                        ${chapter.has_content ? 
                            `✅ 已生成 (${chapter.versions || 1}个版本)` : 
                            '⏳ 待生成'
                        } | 
                        更新: ${new Date(chapter.last_modified).toLocaleDateString()}
                    </div>
                `;
                
                chapterList.appendChild(chapterItem);
            });
        }

        // 选择章节
        async function selectChapter(chapter) {
            try {
                // 更新UI状态
                document.querySelectorAll('.chapter-item').forEach(item => {
                    item.classList.remove('active');
                });
                event.currentTarget.classList.add('active');
                
                currentChapter = chapter;
                updateStatus(`正在加载 ${chapter.title}...`);
                
                // 加载章节内容
                const content = await loadChapterContent(chapter.id);
                
                if (content && content.versions && content.versions.length > 0) {
                    renderChapterContent(content);
                    document.getElementById('versionTabs').style.display = 'flex';
                } else {
                    showNoContent();
                    document.getElementById('versionTabs').style.display = 'none';
                }
                
                updateStatus(`${chapter.title} 加载完成`);
            } catch (error) {
                console.error('加载章节内容失败:', error);
                showError('加载章节内容失败: ' + error.message);
            }
        }

        // 从后端API加载章节内容
        async function loadChapterContent(chapterId) {
            try {
                const response = await fetch(`/api/chapters/${chapterId}`);
                const result = await response.json();
                
                if (result.success) {
                    return result.data;
                } else {
                    throw new Error(result.error || '获取章节内容失败');
                }
            } catch (error) {
                console.error('API调用失败:', error);
                // 如果API调用失败，返回模拟数据
                return generateMockChapterContent(chapterId);
            }
        }

        // 生成模拟章节内容（作为备用）
        function generateMockChapterContent(chapterId) {
            return {
                title: `第${chapterId}章`,
                versions: [
                    {
                        id: 1,
                        content: `这是第${chapterId}章的第一个版本内容。\n\n陈雪站在窗前，望着远方的城市灯火。夜色如墨，但她的心情却异常复杂。今天发生的一切都让她感到不安，那些看似平常的细节背后，似乎隐藏着不为人知的秘密。\n\n她回想起下午在办公室里的对话，每一个字都像是一把利剑，刺痛着她的心。那些曾经信任的同事，现在却让她感到陌生。\n\n"我必须找出真相。"她轻声说道，声音在寂静的房间里显得格外清晰。`,
                        score: Math.floor(Math.random() * 40) + 60,
                        method: '思维链生成',
                        timestamp: new Date()
                    },
                    {
                        id: 2,
                        content: `这是第${chapterId}章的第二个版本内容。\n\n夜幕降临，陈雪独自一人走在回家的路上。街道两旁的灯光忽明忽暗，就像她此刻的心情一样复杂。\n\n今天的工作让她感到前所未有的压力，那些看似简单的任务背后，却隐藏着复杂的政治斗争。她开始怀疑自己的选择，是否真的应该卷入这场漩涡。\n\n突然，她听到身后传来脚步声。回头一看，一个熟悉的身影正朝她走来。`,
                        score: Math.floor(Math.random() * 40) + 60,
                        method: '传统生成',
                        timestamp: new Date()
                    },
                    {
                        id: 3,
                        content: `这是第${chapterId}章的第三个版本内容。\n\n陈雪坐在咖啡厅里，手中握着一杯已经凉透的咖啡。她的目光透过窗户，看着外面匆匆忙忙的行人。\n\n今天发生的事情让她彻底改变了对这个世界的看法。那些她曾经深信不疑的真理，现在却显得如此脆弱。\n\n"也许，我从来就没有真正了解过这个世界。"她苦笑着摇了摇头。`,
                        score: Math.floor(Math.random() * 40) + 60,
                        method: '混合生成',
                        timestamp: new Date()
                    }
                ]
            };
        }

        // 渲染章节内容
        function renderChapterContent(content) {
            document.getElementById('contentTitle').textContent = content.title;
            
            // 渲染版本标签
            const versionTabs = document.getElementById('versionTabs');
            versionTabs.innerHTML = '';
            
            content.versions.forEach((version, index) => {
                const tab = document.createElement('div');
                tab.className = `version-tab ${index === 0 ? 'active' : ''}`;
                tab.onclick = () => switchVersion(index + 1);
                tab.textContent = `版本 ${index + 1}`;
                versionTabs.appendChild(tab);
            });
            
            // 显示第一个版本
            currentVersion = 1;
            displayVersion(content.versions[0]);
        }

        // 切换版本
        function switchVersion(versionNumber) {
            if (!currentChapter) return;
            
            // 更新标签状态
            document.querySelectorAll('.version-tab').forEach((tab, index) => {
                tab.classList.toggle('active', index === versionNumber - 1);
            });
            
            currentVersion = versionNumber;
            
            // 重新加载内容
            loadChapterContent(currentChapter.id).then(content => {
                if (content && content.versions && content.versions[versionNumber - 1]) {
                    displayVersion(content.versions[versionNumber - 1]);
                }
            });
        }

        // 显示版本内容
        function displayVersion(version) {
            const contentDisplay = document.getElementById('contentDisplay');
            
            contentDisplay.innerHTML = `
                <div class="score-display">
                    评分: ${version.score} 分 | 方法: ${version.method}
                </div>
                <div class="content-text">${version.content}</div>
            `;
        }

        // 显示无内容状态
        function showNoContent() {
            document.getElementById('contentTitle').textContent = currentChapter.title;
            document.getElementById('contentDisplay').innerHTML = `
                <div style="text-align: center; padding: 40px; color: #666;">
                    <h3>📝 该章节尚未生成内容</h3>
                    <p>点击"生成新章节"按钮开始创作</p>
                </div>
            `;
        }

        // 刷新章节
        function refreshChapters() {
            updateStatus('正在刷新章节列表...');
            loadChapters();
        }

        // 生成新章节
        async function generateNewChapter() {
            if (!currentChapter) {
                showError('请先选择一个章节');
                return;
            }
            
            updateStatus('正在生成新章节...');
            
            try {
                const response = await fetch(`/api/generate/${currentChapter.id}`);
                const result = await response.json();
                
                if (result.success) {
                    showSuccess(`第${currentChapter.id}章生成任务已启动！任务ID: ${result.task_id}`);
                    // 刷新章节列表
                    setTimeout(() => {
                        loadChapters();
                    }, 2000);
                } else {
                    throw new Error(result.error || '生成失败');
                }
            } catch (error) {
                console.error('生成章节失败:', error);
                showError('生成章节失败: ' + error.message);
            }
        }

        // 训练模型
        async function trainModel() {
            updateStatus('正在启动模型训练...');
            
            try {
                const response = await fetch('/api/train');
                const result = await response.json();
                
                if (result.success) {
                    showSuccess(`模型训练任务已启动！任务ID: ${result.task_id}`);
                } else {
                    throw new Error(result.error || '训练失败');
                }
            } catch (error) {
                console.error('训练模型失败:', error);
                showError('训练模型失败: ' + error.message);
            }
        }

        // 查看统计
        async function viewStats() {
            try {
                const response = await fetch('/api/stats');
                const result = await response.json();
                
                if (result.success) {
                    const stats = result.data;
                    alert(`统计信息：
总章节数: ${stats.total_chapters}
已完成: ${stats.completed_chapters}
完成率: ${stats.completion_rate.toFixed(1)}%
最后更新: ${new Date(stats.last_updated).toLocaleString()}`);
                } else {
                    throw new Error(result.error || '获取统计失败');
                }
            } catch (error) {
                console.error('获取统计失败:', error);
                showError('获取统计失败: ' + error.message);
            }
        }


        // 更新状态栏
        function updateStatus(message) {
            document.getElementById('statusBar').textContent = message;
        }

        // 显示错误信息
        function showError(message) {
            const contentDisplay = document.getElementById('contentDisplay');
            contentDisplay.innerHTML = `
                <div class="error-message">
                    <strong>❌ 错误:</strong> ${message}
                </div>
            `;
        }

        // 显示成功信息
        function showSuccess(message) {
            const contentDisplay = document.getElementById('contentDisplay');
            contentDisplay.innerHTML = `
                <div class="success-message">
                    <strong>✅ 成功:</strong> ${message}
                </div>
            `;
        }
    </script>
</body>
</html>
